services:
  - type: web
    name: online-payment-fraud-detection-system
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && python -m src.train && python -m src.monitoring
    startCommand: uvicorn src.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
